# Deploy do site estático (Angular) para o GitHub Pages
#
# Como ativar:
#   1. Repositório PÚBLICO (plano Free) OU plano Pro/Team (repo privado):
#      Settings > General > Danger Zone > Change visibility > Public
#   2. Settings > Pages > Source > "GitHub Actions"
#   3. Este workflow roda automaticamente a cada push para `main`
#      (ou manualmente: Actions > "Deploy to GitHub Pages" > Run workflow).
#
# URL final: https://matheusbgaspar.github.io/SiteFightPoint/

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permissões necessárias para o GitHub Pages / Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que apenas um deploy por vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --base-href=/SiteFightPoint/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Saída do Angular 22 (application builder)
          path: dist/fight-point-site/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
